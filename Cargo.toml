[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/supervisor",
    "crates/proxy",
    "crates/penpot-rpc",
    "crates/sync-core",
    "crates/sync-daemon",
    "crates/board-export",
    "crates/vault-index",
    "crates/installer",
    "crates/app-state",
    "crates/packages",
    "crates/vault-ops",
    "crates/web-ui",
    "crates/app-core",
    "apps/cli",
]

[workspace.package]
# Placeholder — released versions are derived from git tags by the release
# workflow (scripts/release-plan.sh; see docs/RELEASES.md). Do not bump.
version = "0.3.0"
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
