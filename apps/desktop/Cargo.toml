[package]
name = "penpot-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "penpot-desktop"

[lib]
name = "penpot_desktop"
path = "src/lib.rs"

[[bin]]
name = "penpot-desktop"
path = "src/main.rs"

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
penpot-rpc = { path = "../../crates/penpot-rpc" }
sync-core = { path = "../../crates/sync-core" }
sync-daemon = { path = "../../crates/sync-daemon" }
vault-index = { path = "../../crates/vault-index" }
installer = { path = "../../crates/installer" }
app-state = { path = "../../crates/app-state" }
vault-ops = { path = "../../crates/vault-ops" }
app-core = { path = "../../crates/app-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# `tests/packaged_layout_sim.rs` asserts the packaged-mode command lines the
# re-exported `supervisor_config` builds, so it names `supervisor::` types
# directly. Test-only since chapter C moved the boot body to `app-core`:
# nothing in this crate's own lib/bins mentions the supervisor any more.
supervisor = { path = "../../crates/supervisor" }
